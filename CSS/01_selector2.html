<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>css-선택자2</title>
  <style>
    /* 자손(후손)선택자 -div의 하위레벨 모든 depth에 있는 h3 */
    div h3 { margin: 0; color: darkred; }

    /* 자식 선택자 -div 바로 아래 depth의 h3만 적용 */
    div > h3 { background: yellow; }
    ul > li > h3 { text-decoration: line-through underline; }

    div ol li > h3 { border: 3px solid lightseagreen; }
  
    ol.orange { color: orange; }
    .pink { color: pink; border: 1px dashed #808080; }
    .strong { color: deeppink; font-size: 20px;}
    .etc { color: red; font-size: 12px; border: 5px dashed gold;}
  </style>
</head>
<body>
  <h3>하위선택자-h3</h3>


  <div>
    <h3 class="orange">여행 준비물 챙기기-h3</h3>
    <ul>
      <li class="pink">비상식량
        <ol class="orange">
          <li class="strong"><strong>라면</strong></li>
          <li>에너지바</li>
          <li>사탕</li>
          <li>쌀</li>
        </ol>
      </li>
      <li>
        <h3>세면도구-h3</h3>
        <ul class="strong">
          <li class="orange">비누</li>
          <li>치약/칫솔</li>
          <li>샴푸</li>
          <li>수건</li>
        </ul>
      </li>
      <li>의류
        <ol>
          <li><h3 class="orange">상의-h3</h3>
            <ul class="pink">
              <li>티셔츠</li>
              <li>짚업후드</li>
              <li>바람막이</li>
            </ul>
          </li>
          <li>하의
            <ol>
              <li>청바지</li>
              <li><h3>추리닝-h3</h3></li>
              <li class="orange">반바지</li>
            </ol>
          </li>
          <li>외투</li>
          <li>속옷</li>
        </ol>
      </li>
      <li class="strong">약품</li>
      <li class="">기타 등등</li>
    </ul>
  </div>
</body>
</html>
