<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>속성선택자</title>
  <style>
    input { padding: 10px 20px; }
    input[type="text"] { background: skyblue; }
    input[title] { border: 3px solid blue ;}
  </style>
</head>
<body>
  <h2>속성(attribute)</h2>
  <input type="text" placeholder="text">
  <input type="password" placeholder="password">
  <input type="text" placeholder="text" title="인풋입니다.">
  <input type="tel" placeholder="tel">
  <input type="text" placeholder="text">
  <input type="search" placeholder="search">
  <br><br><hr><br></br><br>

  <a>네이버</a><br>
  <a href="http://www.google.com">구글</a><br>
  <a href="#">↑↑↑↑ TOP ↑↑↑↑</a><br>
  <a href="https://developer.mozilla.org/ko/" title="web사전 MDN">MDN</a><br>
  <a href="https://www.w3schools.com/" title="W3schools">W3schools</a>
  <style>
    a { text-decoration: none; }
    a[href] { color: orangered;}

    a[title ^="web"] { background: lightpink; }
    /* 속성 title의 속성값(value)이 web으로 시작하는 a */

    a[title $= ools] { border-bottom: 1px solid red;}
    /* 속성 title의 속성값(value)이 ools으로 끝나는 a */

    a[href *= goo] { background: yellow; }
    /* 속성 href의 속성값(value)에 goo가 포함되어 있는 a */
  </style>
</body>
</html>
