<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fullscreen배경</title>
  <style>
    body { margin: 0; }
    #wrap {
      
      width: 100%; height: 100vh;
      /* vh(viewport height) 브라우저 세로길이 전체를 100 */
      text-align: center;
    
      background-image: url('img/pexels-jonathanborba-36428068.jpg');
      background-size: cover;
      /* contain - 이미지가 잘리지 않고 배율 유지되게(빈여백이 있을 수 있다) */
      /* cover - 이미지가 잘릴 수도 있지만 꽉차게 보여줌 */
      background-repeat: no-repeat;
      background-position: center bottom 80%;
    }
    


    #wrap > div {
    padding-top: 10vh;}
    #wrap > div img { width: 20vh; }
    #wrap > div p {
      margin: 0; /* p태그의 여백이 싫을 때 */
      font-size: 10vh;
      line-height: 100%;
      text-transform: uppercase;
      font-weight: bold;
    }
    small { font-size: 5vh; }

  </style>
</head>
<body>
  <div id="wrap">
    <div>
      <img src="img/img.png" alt="">
      <p>keep<br> calm<br> <small>and</small><br> carry<br> on</p>
    </div>
  </div>
</body>
</html>
