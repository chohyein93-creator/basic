<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>object fit</title>
  <style>
    .car { width: 400px; height: 400px; border: 2px solid black;
    float: left; margin: 20px; }

    .car img { width: 100%; height: 100%; }
    .car1 img {  }
    .car2 img { object-fit: fill; }
    .car3 img { object-fit: contain; }
    .car4 img { object-fit: cover; }
  </style>
</head>
<body>
  <dl>
    <dt><h3>object-fit</h3></dt>
    <dd>이미지, 동영상등의 비율, 사이즈를 부모요소 크기에 맞춰서 조절</dd>
    <dd><strong>object-fit: fill</strong> - 요소(이미지, 동영상)의 비율을 무시하고 꽉 채움</dd>
    <dd><strong>object-fit: contain</strong> - 요소 비율을 유지하고 꽉채움, 여백이 있을 수 있음</dd>
    <dd><strong>object-fit: cover</strong> - 요소 비율을 유지하고, 여백 없이 꽉채움. 요소가 짤릴 수 있음</dd>
  </dl>

  <div class="car car1"><img src="img/car1.jpg" alt="자동차"></div>
  <div class="car car2"><img src="img/car1.jpg" alt="자동차"></div>
  <div class="car car3"><img src="img/car1.jpg" alt="자동차"></div>
  <div class="car car4"><img src="img/car1.jpg" alt="자동차"></div>
</body>
</html>
