<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>color</title>
  <style>
    body { background: #808080; padding-bottom: 50px; }
    .box { width: 400px; height: 400px; border: 5px solid white; margin: 20px; float: left; 
    font-size: 20px;
    }
    .b1 { background: LightGoldenrodYellow; opacity: 0.4; }
    .b2 { background: rgba(250, 250, 210, 0.4); } /* 투명도 0.4추가. 배경만 투명해진다. */
    .b3 { background-image: linear-gradient(-45deg, Fuchsia,RosyBrown, Chartreuse); }
    .b4 { background-image: linear-gradient( to right, Fuchsia,RosyBrown, Chartreuse); }
    /* to bottom(default)/ to top / to left / to right */
    .b5 { background-image: linear-gradient( 0deg, Fuchsia 60%, Chartreuse 70% ); }
    .b6 { background-image: repeating-linear-gradient( Fuchsia 60%, Chartreuse 70% ) }
    .b7 { clear: both;
        background: radial-gradient(Fuchsia 10%, RosyBrown, Chartreuse); }
    .b8 { 
        background: radial-gradient(Fuchsia 10%, RosyBrown, Chartreuse); height: 200px; }
    .b9 { background: radial-gradient(circle, Fuchsia 10%, RosyBrown, Chartreuse); height: 200px; }
    .b10 { clear: both; background: conic-gradient(Fuchsia 10%, RosyBrown, Chartreuse); border-radius: 50%; }

    .b11 { background: linear-gradient(150deg,rgba(18, 54, 71, 1) 20%, rgba(194, 212, 91, 0.5) 50%, rgba(255, 123, 0, 1) 76%); }

    button { padding: 30px 140px; border: 0;
    background-image: linear-gradient(#4581c5 10%, #94BBE9 85%, #4581c5 90%);
    }
    button:last-of-type { background-image: linear-gradient(#3ad59f 10%, #f8ff00 85%, #3ad59f 90%);
    }
  </style>
</head>
<body>
  <div class="box b1">background: LightGoldenrodYellow;</div>
  <div class="box b2">background: rgb(250, 250, 210)</div>
  <div class="box b3">background-image: linear-gradient(-45deg, Fuchsia,RosyBrown, Chartreuse);</div>
  <div class="box b4">background-image: linear-gradient( to right, Fuchsia,RosyBrown, Chartreuse);</div>
  <div class="box b5"></div>
  <div class="box b6"></div>
  <div class="box b7"></div>
  <div class="box b8"></div>
  <div class="box b9"></div>
  <div class="box b10"></div>
  <div class="box b11"></div>

  <hr style="clear: both;">

  <button>BUTTON</button>
  <button>BUTTON</button>
</body>
</html>
