<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Practice<title>
  <style>
    /* 선택된 텍스트를 빨간색 배경 위 금색으로 만듭니다. */
    ::selection {
      color: gold;
      background-color: red;
    }

    /* 선택된 텍스트를 빨간색 배경 위 금색으로 만듭니다. */
  </style>
</head>
<body>
  이 텍스트를 하이라이트하면 특별한 스타일이 적용됩니다.
  <p>단락에서 텍스트를 선택해 보세요.</p>
</body>
</html>
